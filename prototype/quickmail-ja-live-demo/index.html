<!doctype html>
<html lang="ja">

  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <title>Noroshi 操作可能デモ</title>
  <style>
    :root {
      --bg:#f7f8f7; --surface:#fff; --surface-2:#f2f4f3; --surface-3:#e8eeea;
      --text:#262b28; --sub:#68716c; --muted:#626b66; --line:#dfe4e1;
      --accent:#527461; --accent-2:#527461; --on-accent:#fff;
      --compose-bg:var(--accent); --on-compose:var(--on-accent); --focus-ring:rgba(82,116,97,.18);
      --banner-bg:#e2ece6; --banner-text:#385346; --banner-line:#ccdcd2;

      --danger:#a63f3f; --warn:#715015; --warn-bg:#fff5d7; --good:#3f714f; --star:#805600;
      --shadow:0 14px 38px rgba(38,59,47,.08); --sidebar:236px; --banner-height:58px;
    }
    [data-theme="dark"] {
      --bg:#121513; --surface:#1b201d; --surface-2:#242a27; --surface-3:#2b3931;
      --text:#edf2ef; --sub:#b2bcb6; --muted:#96a29b; --line:#3a443e;
      --accent:#88ad99; --accent-2:#88ad99; --on-accent:#0f1813;
      --compose-bg:var(--accent); --on-compose:var(--on-accent); --focus-ring:rgba(136,173,153,.22);
      --banner-bg:#203128; --banner-text:#c7ddd0; --banner-line:#35493e;
      --brand-mark-bg:#2b4638; --brand-mark-text:#d5eee0;
      --danger:#f19a9a; --warn:#e2bd73; --warn-bg:#352d19; --good:#93c7a5; --star:#f3c969;
      --shadow:0 18px 46px rgba(0,0,0,.25);
    }
    .app[data-profile="calm"] {
      --bg:#f6f8fc; --surface:#fff; --surface-2:#eef3f8; --surface-3:#d3e3fd;
      --text:#1f1f1f; --sub:#444746; --muted:#5f6368; --line:#c4c7c5;
      --accent:#0b57d0; --accent-2:#0b57d0; --on-accent:#fff;
      --compose-bg:#c2e7ff; --on-compose:#001d35; --focus-ring:rgba(11,87,208,.18);
      --banner-bg:#d3e3fd; --banner-text:#041e49; --banner-line:#a8c7fa;
      --brand-mark-bg:#c2e7ff; --brand-mark-text:#001d35;
      --danger:#b3261e; --warn:#725c00; --warn-bg:#fff8c7; --good:#146c2e; --star:#a15c00;
      --shadow:0 1px 2px rgba(60,64,67,.18),0 1px 3px 1px rgba(60,64,67,.08);
      --font-ui:Roboto,Arial,"Noto Sans JP",sans-serif;
      --sidebar:256px; --layout-radius:16px; --row-height:56px;
    }
    .app[data-profile="command"] {
      --bg:#f5f5f5; --surface:#fff; --surface-2:#f0f0f0; --surface-3:#ebf3fc;
      --text:#242424; --sub:#424242; --muted:#616161; --line:#e0e0e0;
      --accent:#0f6cbd; --accent-2:#0f6cbd; --on-accent:#fff;
      --compose-bg:#0f6cbd; --on-compose:#fff; --focus-ring:rgba(15,108,189,.20);
      --banner-bg:#ebf3fc; --banner-text:#0f548c; --banner-line:#b4d6fa;
      --brand-mark-bg:#cfe4fa; --brand-mark-text:#0f548c;
      --danger:#c50f1f; --warn:#8a3707; --warn-bg:#fff4ce; --good:#0e700e; --star:#8a5a00;
      --shadow:0 2px 8px rgba(0,0,0,.14);
      --font-ui:"Segoe UI",system-ui,sans-serif;
      --sidebar:240px; --layout-radius:6px; --row-height:44px;
    }
    .app[data-profile="classic"] {
      --bg:#f0f0f4; --surface:#fff; --surface-2:#e9e9ed; --surface-3:#d9e8f6;
      --text:#1c1b22; --sub:#3d3d45; --muted:#5b5b66; --line:#cfcfd8;
      --accent:#0060df; --accent-2:#0060df; --on-accent:#fff;
      --compose-bg:#0060df; --on-compose:#fff; --focus-ring:rgba(0,96,223,.22);
      --banner-bg:#d9e8f6; --banner-text:#003eaa; --banner-line:#a8c5e5;
      --brand-mark-bg:#cfe8ff; --brand-mark-text:#003eaa;
      --danger:#c50042; --warn:#6f4e00; --warn-bg:#fff6d8; --good:#2b7a3d; --star:#895f00;
      --shadow:0 2px 7px rgba(12,12,13,.16);
      --font-ui:system-ui,"Segoe UI",sans-serif;
      --sidebar:220px; --layout-radius:4px; --row-height:40px;
    }
    .app[data-profile="calm"][data-theme="dark"] {
      --bg:#111318; --surface:#1f1f1f; --surface-2:#292a2d; --surface-3:#3c4043;
      --text:#e3e3e3; --sub:#c4c7c5; --muted:#bdc1c6; --line:#444746;
      --accent:#a8c7fa; --accent-2:#a8c7fa; --on-accent:#062e6f;
      --compose-bg:#c2e7ff; --on-compose:#001d35; --focus-ring:rgba(168,199,250,.26);
      --banner-bg:#25324a; --banner-text:#d3e3fd; --banner-line:#435b80;
      --brand-mark-bg:#294766; --brand-mark-text:#c2e7ff;
      --danger:#f2b8b5; --warn:#f6e58d; --warn-bg:#423b12; --good:#8bdca2; --star:#fdd663;
      --shadow:0 1px 2px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.22);
    }
    .app[data-profile="command"][data-theme="dark"] {
      --bg:#1f1f1f; --surface:#292929; --surface-2:#333333; --surface-3:#243b4d;
      --text:#f5f5f5; --sub:#d6d6d6; --muted:#d6d6d6; --line:#484848;
      --accent:#479ef5; --accent-2:#479ef5; --on-accent:#082338;
      --compose-bg:#115ea3; --on-compose:#fff; --focus-ring:rgba(71,158,245,.28);
      --banner-bg:#0f3a5d; --banner-text:#ebf3fc; --banner-line:#286a9f;
      --brand-mark-bg:#0f548c; --brand-mark-text:#ebf3fc;
      --danger:#ff99a4; --warn:#fce100; --warn-bg:#433519; --good:#54b054; --star:#f7c34a;
      --shadow:0 4px 14px rgba(0,0,0,.36);
    }
    .app[data-profile="classic"][data-theme="dark"] {
      --bg:#1c1b22; --surface:#2b2a33; --surface-2:#38383d; --surface-3:#1f3449;
      --text:#fbfbfe; --sub:#d7d7db; --muted:#d7d7db; --line:#52525e;
      --accent:#0a84ff; --accent-2:#80ebff; --on-accent:#00131f;
      --compose-bg:#0a84ff; --on-compose:#00131f; --focus-ring:rgba(128,235,255,.24);
      --banner-bg:#18324f; --banner-text:#d9e8f6; --banner-line:#315a82;
      --brand-mark-bg:#164f86; --brand-mark-text:#80ebff;
      --danger:#ff9aa2; --warn:#ffd567; --warn-bg:#403516; --good:#7bd88f; --star:#ffd567;
      --shadow:0 4px 16px rgba(0,0,0,.38);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      color:var(--text); background:var(--bg);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    }
    button,input,textarea,select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    a { color:inherit; text-decoration:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .qm-icon { display:inline-block; width:1.1rem; height:1.1rem; flex:none; fill:currentColor; vertical-align:-.18em; }
    .brand-mark .qm-icon { width:1.2rem; height:1.2rem; }
    .demo-banner {
      position:fixed; inset:0 0 auto; z-index:100; height:var(--banner-height);
      display:flex; align-items:center; justify-content:center; gap:.75rem;
      padding:0 1rem; color:var(--banner-text); background:var(--banner-bg); border-bottom:1px solid var(--banner-line);
      font-size:.76rem; font-weight:600;
    }
    .demo-dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--accent-2); }
    .demo-copy { min-width:0; }
    .demo-profile-switcher { display:flex; flex:none; align-items:center; gap:.25rem; padding:.2rem; background:rgba(255,255,255,.55); border:1px solid currentColor; border-radius:10px; }
    [data-theme="dark"] .demo-profile-switcher { background:rgba(0,0,0,.18); }
    .demo-profile-switcher button { min-height:30px; padding:0 .65rem; color:inherit; background:transparent; border:0; border-radius:7px; font-size:.72rem; font-weight:700; }
    .demo-profile-switcher button.active { color:var(--on-accent); background:var(--accent); }
    .demo-connectivity-toggle { min-height:30px; padding:0 .65rem; color:inherit; background:transparent; border:1px solid currentColor; border-radius:8px; font-size:.72rem; font-weight:700; }
    .app { min-height:100vh; padding-top:var(--banner-height); font-family:var(--font-ui); }
    .sidebar {
      position:fixed; top:var(--banner-height); left:0; bottom:0; z-index:40; width:var(--sidebar);
      display:flex; flex-direction:column; padding:.9rem .75rem .75rem;
      background:var(--surface); border-right:1px solid var(--line); overflow:auto;
    }
    [data-profile="command"] .sidebar { padding:.55rem .45rem; }
    [data-profile="classic"] .sidebar { padding:.45rem .35rem; background:var(--surface-2); }
    .brand { display:flex; align-items:center; gap:.55rem; padding:0 .25rem .9rem; font-weight:700; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:9px; color:var(--brand-mark-text); background:var(--brand-mark-bg); }
    .compose-new {
      display:flex; align-items:center; justify-content:center; gap:.45rem; min-height:42px;
      margin-bottom:1rem; color:var(--on-compose); background:var(--compose-bg); border:0; border-radius:12px; font-weight:600;
    }
    [data-profile="calm"] .compose-new { justify-content:flex-start; min-height:56px; padding:0 1.15rem; border-radius:16px; box-shadow:var(--shadow); }
    [data-profile="command"] .compose-new { min-height:36px; border-radius:4px; }
    [data-profile="classic"] .compose-new { min-height:34px; border-radius:4px; }
    .nav { display:grid; gap:.15rem; }
    .nav-btn {
      display:flex; align-items:center; gap:.65rem; min-height:38px; width:100%; padding:0 .65rem;
      color:var(--sub); background:transparent; border:0; border-radius:10px; text-align:left;
    }
    [data-profile="command"] .nav-btn { min-height:34px; border-radius:3px; }
    [data-profile="classic"] .nav-btn { min-height:30px; padding:0 .5rem; border-radius:6px; font-size:.76rem; }
    .nav-btn:hover,.nav-btn.active { color:var(--text); background:var(--surface-2); }
    .nav-btn.active { font-weight:600; }
    .nav-icon { width:1.2rem; text-align:center; }
    .count { margin-left:auto; min-width:20px; padding:1px 6px; color:var(--on-accent); background:var(--accent); border-radius:999px; font-size:.68rem; text-align:center; }
    .section-label { display:flex; align-items:center; justify-content:space-between; margin:1rem .6rem .3rem; color:var(--muted); font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .icon-button { display:grid; place-items:center; width:34px; height:34px; padding:0; color:var(--sub); background:transparent; border:0; border-radius:9px; }
    .icon-button:hover { color:var(--text); background:var(--surface-2); }
    .folder-add { width:26px; height:26px; }
    .folder-row { display:grid; grid-template-columns:minmax(0,1fr) 30px; gap:.15rem; align-items:center; }
    .folder-row .folder-tools { width:30px; height:30px; }
    .sidebar-foot { margin-top:auto; padding-top:1rem; }
    .content-shell { margin-left:var(--sidebar); min-height:calc(100vh - var(--banner-height)); }
    .topbar {
      position:sticky; top:var(--banner-height); z-index:30; height:66px; display:flex; align-items:center; gap:.8rem;
      padding:0 1.25rem; background:color-mix(in srgb,var(--surface) 94%,transparent); border-bottom:1px solid var(--line); backdrop-filter:blur(14px);
    }
    [data-profile="command"] .topbar { height:56px; padding:0 .8rem; }
    [data-profile="classic"] .topbar { height:50px; padding:0 .65rem; box-shadow:inset 0 -2px 0 var(--accent); }
    .search-wrap { position:relative; flex:1; max-width:540px; }
    [data-profile="calm"] .search-wrap { flex:0 1 min(680px,60vw); width:min(680px,60vw); max-width:none; }
    .search-input {
      width:100%; height:38px; padding:0 2.6rem 0 2.25rem; background:var(--surface-2); border:1px solid transparent; border-radius:12px; outline:none;
    }
    [data-profile="calm"] .search-input { height:46px; border-radius:24px; }
    [data-profile="command"] .search-input { border-radius:4px; }
    [data-profile="classic"] .search-input { height:32px; border-radius:4px; }
    .search-input:focus { background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 3px var(--focus-ring); }
    .search-symbol { position:absolute; left:.8rem; top:.45rem; color:var(--muted); }
    .search-go { position:absolute; right:.25rem; top:.2rem; width:34px; height:34px; color:var(--muted); background:transparent; border:0; border-radius:9px; }
    .search-go:hover { color:var(--text); background:var(--surface-3); }
    .account { position:relative; margin-left:auto; }
    .account-button { display:flex; align-items:center; gap:.55rem; padding:.25rem; background:transparent; border:0; border-radius:999px; }
    .account-button:hover { background:var(--surface-2); }
    .account-copy { display:grid; text-align:right; line-height:1.25; font-size:.72rem; }
    .account-copy strong { font-size:.8rem; }
    .account-copy span { color:var(--muted); }
    .avatar { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--surface-3); font-size:.72rem; font-weight:700; }
    .account-menu {
      position:absolute; top:45px; right:0; width:210px; padding:.45rem; background:var(--surface); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow);
    }
    .account-menu button { width:100%; padding:.65rem .7rem; background:transparent; border:0; border-radius:8px; text-align:left; }
    .account-menu button:hover { background:var(--surface-2); }
    main { min-height:calc(100vh - 108px); }
    .page { width:min(1060px,calc(100% - 2.5rem)); margin:0 auto; padding:1.5rem 0 4rem; }
    .page.narrow { width:min(820px,calc(100% - 2.5rem)); }
    .page-head { display:flex; align-items:center; gap:.75rem; min-height:46px; margin-bottom:.65rem; }
    .page-head h1 { margin:0; font-size:1.25rem; letter-spacing:-.02em; }
    .page-head .total { color:var(--muted); font-size:.76rem; }
    .head-actions { display:flex; align-items:center; gap:.45rem; margin-left:auto; }
    .button,.button-primary,.button-danger {
      min-height:40px; padding:0 .9rem; border-radius:var(--layout-radius,10px); border:1px solid var(--line); font-size:.82rem; font-weight:600;
    }
    .button { color:var(--text); background:var(--surface); }
    .button:hover { background:var(--surface-2); }
    .button-primary { color:var(--on-accent); background:var(--accent-2); border-color:var(--accent-2); }
    .button-danger { color:#fff; background:var(--danger); border-color:var(--danger); }
    .button.small,.button-primary.small { min-height:34px; padding:0 .65rem; font-size:.75rem; }
    .toolbar {
      display:flex; align-items:center; gap:.6rem; min-height:50px; padding:.45rem .65rem;
      background:var(--surface); border:1px solid var(--line); border-radius:14px 14px 0 0;
    }
    .toolbar .spacer { flex:1; }
    .filter-pill { min-height:34px; padding:0 .7rem; color:var(--sub); background:var(--surface-2); border:1px solid transparent; border-radius:999px; font-size:.75rem; }
    .filter-pill.active { color:var(--text); background:var(--surface-3); border-color:var(--accent); }
    .mail-list { margin:0; padding:0; list-style:none; background:var(--surface); border:1px solid var(--line); border-top:0; border-radius:0 0 14px 14px; overflow:hidden; }
    .mail-row {
      display:grid; grid-template-columns:34px 30px 42px 170px minmax(0,1fr) auto; align-items:center; gap:.5rem;
      min-height:var(--row-height,72px); padding:.6rem .75rem; border-top:1px solid var(--line);
    }
    [data-profile="command"] .mail-row { grid-template-columns:28px 24px 34px 150px minmax(0,1fr) auto; padding:.38rem .55rem; }
    [data-profile="classic"] .mail-row { grid-template-columns:24px 22px 28px 132px minmax(0,1fr) auto; padding:.25rem .45rem; gap:.35rem; font-size:.76rem; }
    [data-profile="classic"] .row-avatar { width:28px; height:28px; border-radius:7px; }
    .mail-row:first-child { border-top:0; }
    .mail-row.unread { background:color-mix(in srgb,var(--accent) 7%,var(--surface)); }
    .mail-row.current { box-shadow:inset 3px 0 0 var(--accent); background:var(--surface-3); }
    .mail-row:hover { background:var(--surface-2); }
    .select-box { width:17px; height:17px; accent-color:var(--accent-2); }
    .select-hit { display:grid; place-items:center; }
    .star { color:var(--muted); background:transparent; border:0; font-size:1rem; }
    .star.on { color:var(--star); }
    .row-avatar { display:grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:50%; color:var(--text); background:var(--surface-3); font-weight:700; }
    .sender,.subject { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sender { padding:0; color:inherit; background:transparent; border:0; font-size:.82rem; text-align:left; }
    .unread .sender,.unread .subject-main { font-weight:700; }
    .subject { display:flex; min-width:0; gap:.45rem; font-size:.82rem; }
    .preview { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-date { color:var(--muted); font-size:.72rem; white-space:nowrap; }
    .mail-open { display:flex; align-items:center; min-width:0; padding:.25rem 0; color:inherit; background:transparent; border:0; text-align:left; cursor:pointer; }
    .tag { display:inline-flex; align-items:center; min-height:20px; padding:0 .4rem; color:var(--sub); background:var(--surface-2); border-radius:999px; font-size:.65rem; }
    .calm-list-detail { display:block; }
    [data-profile="calm"] .mailbox-page { width:min(1060px,calc(100% - 2.5rem)); }
    [data-profile="calm"] .calm-list-detail .mail-row { min-height:56px; padding:.45rem .9rem; }
    .command-profile-shell,.classic-profile-shell { border:1px solid var(--line); overflow:hidden; }
    .command-profile-shell { border-radius:5px; }
    .command-profile-grid { display:grid; grid-template-columns:clamp(340px,30vw,420px) minmax(0,1fr); min-height:576px; background:var(--surface); }
    .command-actionbar,.classic-actionbar { display:flex; align-items:center; gap:.25rem; min-height:44px; padding:.25rem .4rem; overflow:hidden; white-space:nowrap; background:var(--surface-2); border-bottom:1px solid var(--line); }
    .command-actionbar button,.classic-actionbar button { flex:none; min-height:34px; padding:0 .55rem; background:transparent; border:1px solid transparent; border-radius:5px; font-size:.73rem; }
    .command-actionbar button:hover,.classic-actionbar button:hover { background:var(--surface); border-color:var(--line); }
    .command-list-pane { min-width:0; border-right:1px solid var(--line); }
    .command-list-pane .toolbar { border:0; border-bottom:1px solid var(--line); border-radius:0; }
    .command-list-pane .mail-list { border:0; border-radius:0; }
    [data-profile="command"] .mailbox-page { width:calc(100% - 1.1rem); max-width:none; margin:0 .55rem; }
    [data-profile="command"] .command-list-pane .mail-row { grid-template-columns:24px 24px minmax(0,1fr) auto; min-height:44px; padding:.3rem .55rem; }
    [data-profile="command"] .command-list-pane .row-avatar,
    [data-profile="command"] .command-list-pane .sender { display:none; }
    [data-profile="command"] .command-list-pane .subject { display:block; min-width:0; padding:0; line-height:1.2; }
    [data-profile="command"] .command-list-pane .subject-main { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    [data-profile="command"] .command-list-pane .subject-main::before { content:attr(data-sender); display:block; overflow:hidden; color:var(--text); font-size:.7rem; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    [data-profile="command"] .command-list-pane .preview,
    [data-profile="command"] .command-list-pane .tag { display:none; }
    .command-reading-pane { min-width:0; padding:1.3rem 1.45rem; background:var(--surface); }
    .command-reading-pane .preview-kicker { margin:0 0 .45rem; color:var(--muted); font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .command-reading-pane h2 { margin:0; font-size:1.25rem; }
    .command-reading-meta { margin:.65rem 0 1.2rem; padding-bottom:.8rem; color:var(--sub); border-bottom:1px solid var(--line); font-size:.76rem; }
    .command-reading-body { max-width:68ch; white-space:pre-wrap; font-size:.85rem; }

    function sensitiveReason(value) {
      const text = String(value || "").trim();
      if (!text) return "質問が空です";
      if ([...text].length > 160) return "質問が160文字を超えています";
      if (/[\u0000-\u001f\u007f-\u009f]/u.test(text)) return "制御文字が含まれています";

    function providerUrl(provider, prompt) {
      const config = AI_PROVIDERS[provider];
      if (!config) return "";
      const destination = new URL(config.href);
      if (config.prefill) destination.searchParams.set("q",prompt);
      return destination.toString();

    function isAllowedProviderUrl(provider, value) {
      const config = AI_PROVIDERS[provider];
      if (!config) return false;
      try {
        const candidate = new URL(value);
        const allowed = new URL(config.href);
        const keys = [...candidate.searchParams.keys()];
        const queryIsAllowed = config.prefill
          ? keys.length === 1 && keys[0] === "q" && candidate.searchParams.get("q") !== null
          : keys.length === 0;
        return candidate.protocol === "https:" &&
          !candidate.username && !candidate.password &&
          candidate.origin === allowed.origin &&
          candidate.pathname === allowed.pathname &&
          candidate.hash === "" && queryIsAllowed;
      } catch (error) {
        return false;
      }
    }

    function reducer(state, action) {
      const next = clone(state);
      const message = action.id ? next.messages.find(function(item){ return item.id === action.id; }) : null;
      switch (action.type) {
        case "NAVIGATE":
          next.previousView = next.view === "mail" || next.view === "compose" ? next.previousView : next.view;
          next.view = action.view;
          next.activeMailId = action.id || null;
          if (["inbox","drafts","sent","starred","trash","folder"].includes(action.view)) {
            next.mailboxContext = {view:action.view,folderId:action.view === "folder" ? (action.id || null) : null};
          }
          next.selected = [];
          next.accountOpen = false;
          next.mobileMenuOpen = false;
          next.filter = action.keepFilter ? next.filter : "all";
          return next;
        case "RETURN_TO_MAILBOX":
          next.view = next.mailboxContext.view;
          next.previousView = next.mailboxContext.view;
          next.activeMailId = next.mailboxContext.folderId;
          next.accountOpen = false;
          next.mobileMenuOpen = false;
          next.focusAnchor = "message-" + next.listAnchorId;
          return next;
        case "SELECT_MAIL":
          if (message) {
            next.selectedMessageId = action.id;
            next.listAnchorId = action.id;
            next.focusAnchor = "message-" + action.id;
            message.unread = false;
          }
          return next;
        case "OPEN_MAIL":
          if (message) {
            next.previousView = next.view;
            next.view = "mail";
            next.activeMailId = action.id;
            next.selectedMessageId = action.id;
            next.listAnchorId = action.id;
            next.focusAnchor = "message-" + action.id;
            message.unread = false;
          }
          return next;
        case "SEARCH": next.search = action.value; return next;
        case "SET_OFFLINE": next.offline = Boolean(action.value); return next;
        case "SEARCH_SUBMIT":
          next.search = action.value;
          if (!["inbox","drafts","sent","starred","trash","folder"].includes(next.view)) {
            next.previousView = next.view;
            next.view = "inbox";
            next.activeMailId = null;
            next.selected = [];
            next.accountOpen = false;
            next.mobileMenuOpen = false;
          }
          return next;
        case "FILTER": next.filter = action.value; return next;
        case "TOGGLE_SELECT":
          next.selected = next.selected.includes(action.id)
            ? next.selected.filter(function(id){ return id !== action.id; })
            : next.selected.concat(action.id);
          return next;
        case "SELECT_ALL": next.selected = action.ids; return next;
        case "TOGGLE_STAR":
          if (message) message.starred = !message.starred;
          return next;
        case "SET_READ":
          next.messages.forEach(function(item){ if (action.ids.includes(item.id)) item.unread = !action.read; });
          next.selected = [];
          return next;
        case "BULK_STAR":
          next.messages.forEach(function(item){ if (action.ids.includes(item.id)) item.starred = true; });
          next.selected = [];
          return next;
        case "MOVE":
          next.messages.forEach(function(item){
            if (action.ids.includes(item.id)) {
              item.folder = action.folder;
              item.folderName = action.folder;
            }
          });
          next.selected = [];
          next.toast = action.label + "へ移動しました（デモ内のみ）";
          if (next.view === "mail") next.view = next.previousView || "inbox";
          return next;
        case "RESTORE":
          if (message) { message.folder = "inbox"; message.folderName = ""; }
          next.view = "trash";
          next.toast = "受信トレイへ復元しました（デモ内のみ）";
          return next;
        case "DELETE_FOREVER":
          next.messages = next.messages.filter(function(item){ return item.id !== action.id; });

          return next;
        case "EMPTY_TRASH":
          next.messages = next.messages.filter(function(item){ return item.folder !== "trash"; });
          next.toast = "ゴミ箱を空にしました（デモ内のみ）";

          next.previousView = next.mailboxContext.view;

          const initialBody = action.body !== undefined
            ? action.body
            : composeMode === "new" && !action.draftId && next.settings.signature.trim()
              ? "\n\n--\n" + next.settings.signature.trim()
              : "";
          next.compose = {
            mode:composeMode,
            from:action.from || (defaultAddress ? defaultAddress.address : "info@noroshi.invalid"),
            to:action.to || "",
            cc:"",
            bcc:"",
            subject:action.subject || "",
            body:initialBody,
            attachments:action.attachments || (action.attachment ? [{id:"message-attachment",name:action.attachment,size:0,type:"application/octet-stream"}] : []),
            draftId:action.draftId || null
          };
          return next;
        case "COMPOSE_FIELD": next.compose[action.field] = action.value; next.composeError = ""; return next;
        case "REQUEST_SEND": {
          const validationError = composeValidation(next.compose, next.settings.signature);
          next.composeError = validationError;
          if (!validationError) next.modal = {type:"send"};

            existing.fromAddress = next.compose.from;
            existing.to = next.compose.to;
            existing.subject = next.compose.subject || "（件名なし）";
            existing.body = next.compose.body;
            existing.preview = next.compose.body.slice(0,60);
            existing.attachment = attachmentName(next.compose);

            const id = "draft-" + String(next.messages.length + 1);
            next.messages.unshift({

              subject:next.compose.subject || "（件名なし）",preview:next.compose.body.slice(0,60),
              body:next.compose.body,date:"たった今",unread:false,starred:false,
              attachment:attachmentName(next.compose),folderName:"",draft:true

          return next;
        }
        case "SEND_DEMO": {
          const id = "sent-" + String(next.messages.length + 1);
          next.messages.unshift({
            id:id,folder:"sent",from:"自分",fromAddress:next.compose.from,to:next.compose.to,
            subject:next.compose.subject || "（件名なし）",preview:next.compose.body.slice(0,60),
            body:next.compose.body,date:"たった今",unread:false,starred:false,
            attachment:attachmentName(next.compose),folderName:""
          });
          if (next.compose.draftId) {
            next.messages = next.messages.filter(function(item){ return item.id !== next.compose.draftId; });
          }
          next.view = "sent";
          next.modal = null;
          next.composeError = "";
          next.toast = "送信画面の動作を再現しました。実際のメールは送信していません";
          return next;
        }
        case "OPEN_MODAL": next.modal = action.modal; return next;
        case "CLOSE_MODAL": next.modal = null; return next;
        case "TOAST": next.toast = action.message; return next;
        case "CLEAR_TOAST": next.toast = ""; return next;
        case "ACCOUNT": next.accountOpen = !next.accountOpen; return next;
        case "MOBILE_MENU": next.mobileMenuOpen = !next.mobileMenuOpen; return next;
        case "MOBILE_CLOSE": next.mobileMenuOpen = false; return next;
        case "THEME": next.theme = action.value; return next;
        case "PROFILE":
          if (Object.prototype.hasOwnProperty.call(UI_PROFILES,action.value)) next.profile = action.value;
          next.focusAnchor = ["inbox","drafts","sent","starred","trash","folder"].includes(next.view)
            ? "message-" + next.listAnchorId
            : "profile-selector";
          return next;
        case "SIGNATURE": next.settings.signature = action.value; return next;
        case "FORWARD_DEST":
          if (next.settings.forwardingDestination.toLowerCase() !== action.value.toLowerCase()) {
            next.settings.forwardingDestination = action.value;
            next.settings.forwardingStatus = "pending";
            next.settings.forwardingAcknowledged = false;
            next.toast = "宛先を変更したため、自動転送を無効にして確認待ちへ戻しました（デモ内のみ）";
          } else {
            next.toast = "転送先は変更されていません（デモ内のみ）";
          }
          return next;
        case "VERIFY_FORWARD":
          if (next.settings.forwardingStatus === "pending") next.settings.forwardingStatus = "verified";
          next.settings.forwardingAcknowledged = false;
          next.toast = "宛先確認済みの状態を画面内で再現しました。確認メールは送信していません";
          return next;
        case "FORWARD_ACK":
          if (next.settings.forwardingStatus === "verified") next.settings.forwardingAcknowledged = action.value;

          if (next.settings.forwardingStatus === "verified" && next.settings.forwardingAcknowledged) {
            next.settings.forwardingStatus = "enabled";

          next.folders = next.folders.filter(function(item){ return item.id !== action.id; });

          if (rule) rule.enabled = !rule.enabled;

    let state = clone(INITIAL_STATE);
    const root = document.getElementById("app");
    let dialogTrigger = null;

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }
    function folderName(id) {
      const folder = state.folders.find(function(item){ return item.id === id; });
      return folder ? folder.name : id;
    }
    function rememberDialogTrigger(element) {
      if (state.modal || !element) return;
      dialogTrigger = {
        domId:element.id || "",
        action:element.dataset.action || "",
        id:element.dataset.id || "",
        view:element.dataset.view || ""
      };
    }
    function restoreDialogTrigger() {
      if (!dialogTrigger) return;
      const descriptor = dialogTrigger;
      dialogTrigger = null;
      const byId = descriptor.domId ? document.getElementById(descriptor.domId) : null;
      const candidates = [...root.querySelectorAll('[data-action="' + descriptor.action + '"]')];
      const trigger = candidates.find(function(element){
        return (element.dataset.id || "") === descriptor.id && (element.dataset.view || "") === descriptor.view;
      });
      const fallback = root.querySelector(".compose-new,[data-action=navigate]");
      (byId || trigger || fallback)?.focus();
    }
    function syncDialogAccessibility() {
      const dialog = root.querySelector('[role="dialog"]');
      if (!dialog) return;
      root.querySelectorAll(".demo-banner,.sidebar,.content-shell,.mobile-nav,.mobile-drawer,.mobile-drawer-backdrop").forEach(function(element){
        element.inert = true;
        element.setAttribute("aria-hidden","true");
      });
      const initial = dialog.querySelector("[autofocus],button:not([disabled]),input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled])");
      initial?.focus();
    }
    function restoreLogicalFocus(action) {
      if (action.type === "SET_OFFLINE") {
        root.querySelector('[data-action="offline-toggle"]')?.focus();
        return;
      }
      const shouldRestoreMessage = action.type === "SELECT_MAIL" || action.type === "RETURN_TO_MAILBOX" || action.type === "PROFILE";
      if (shouldRestoreMessage) {
        const messageControl = root.querySelector('[data-focus-key="message-' + state.listAnchorId + '"]');
        if (messageControl) {
          messageControl.focus();
          messageControl.scrollIntoView({block:"nearest",inline:"nearest"});
          return;
        }
      }
      if (action.type === "PROFILE") {
        const profileControl = root.querySelector('.demo-profile-switcher [data-action="profile"][data-profile="' + state.profile + '"]');
        if (profileControl) profileControl.focus();
      }
    }
    function dispatch(action) {
      const hadDialog = Boolean(state.modal);
      state = reducer(state, action);
      render();
      restoreLogicalFocus(action);
      if (hadDialog && !state.modal) restoreDialogTrigger();

        window.clearTimeout(dispatch.toastTimer);
        dispatch.toastTimer = window.setTimeout(function(){ dispatch({type:"CLEAR_TOAST"}); }, 3600);
      }

    async function handoffAI(provider) {
      if (!Object.prototype.hasOwnProperty.call(AI_PROVIDERS, provider)) {
        dispatch({type:"AI_PREVIEW",provider:"",error:"許可されていないAIサービスです",message:"外部サービスへの起動要求は行っていません"});
        return;
      }
      const question = state.ai.question.trim();
      const reason = sensitiveReason(question);
      if (reason) {
        dispatch({type:"AI_PREVIEW",provider:provider,error:reason,message:"安全のため外部引渡しを停止しました"});
        return;
      }
      const prompt = aiPrompt(question, provider);
      const url = providerUrl(provider, prompt);
      if (!isAllowedProviderUrl(provider,url)) {
        dispatch({type:"AI_PREVIEW",provider:provider,error:"遷移先を検証できません",message:"外部サービスへの起動要求は行っていません"});
        return;
      }
      let copy;
      try {
        copy = navigator.clipboard && navigator.clipboard.writeText
          ? navigator.clipboard.writeText(prompt)
          : Promise.reject(new Error("clipboard unavailable"));
      } catch (error) {
        copy = Promise.reject(error);
      }
      try {
        requestProviderLaunch(url);
      } catch (error) {
        await copy.catch(function(){});
        dispatch({type:"AI_PREVIEW",provider:provider,error:"外部サービスへの起動要求を処理できませんでした",message:"外部サービスへの起動要求は行っていません"});
        return;
      }
      try {
        await copy;
        dispatch({type:"AI_PREVIEW",provider:provider,message:provider + "を開くよう端末に要求し、質問文をコピーしました。画面が開いたことを確認し、内容確認後にご自身で送信してください"});
      } catch (error) {
        dispatch({type:"AI_PREVIEW",provider:provider,message:provider + "を開くよう端末に要求しました。コピーできなかったため、画面が開いたことを確認し、下の質問文を手動でコピーしてください"});
      }
    }

    function render() {
      root.innerHTML = renderShell();
      document.documentElement.dataset.theme = state.theme === "dark" ? "dark" : "light";

    root.addEventListener("click", function(event) {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;
      if (action === "navigate") dispatch({type:"NAVIGATE",view:target.dataset.view});
      else if (action === "offline-toggle") dispatch({type:"SET_OFFLINE",value:!state.offline});
      else if (action === "mobile-more") dispatch({type:"MOBILE_MENU"});
      else if (action === "mobile-close") dispatch({type:"MOBILE_CLOSE"});
      else if (action === "compose-new") dispatch({type:"OPEN_COMPOSE",mode:"new"});
      else if (action === "open-mail") {
        const inlineReader = window.matchMedia("(min-width: 768px)").matches && (state.profile === "command" || state.profile === "classic");
        dispatch({type:inlineReader ? "SELECT_MAIL" : "OPEN_MAIL",id:id});
      }
      else if (action === "open-mail-detail") dispatch({type:"OPEN_MAIL",id:id});
      else if (action === "open-draft") {
        const draft = state.messages.find(function(item){ return item.id === id; });
        if (draft) dispatch({type:"OPEN_COMPOSE",mode:"new",draftId:id,from:draft.fromAddress,to:draft.to,subject:draft.subject,body:draft.body,attachments:draft.attachment ? [{id:"draft-attachment",name:draft.attachment,size:0,type:"application/octet-stream"}] : []});
      }
      else if (action === "star") dispatch({type:"TOGGLE_STAR",id:id});
      else if (action === "filter") dispatch({type:"FILTER",value:state.filter === target.dataset.filter ? "all" : target.dataset.filter});
      else if (action === "bulk-read") dispatch({type:"SET_READ",ids:state.selected,read:true});
      else if (action === "bulk-star") dispatch({type:"BULK_STAR",ids:state.selected});
      else if (action === "bulk-archive") dispatch({type:"MOVE",ids:state.selected,folder:"archive",label:"アーカイブ"});
      else if (action === "bulk-trash") dispatch({type:"MOVE",ids:state.selected,folder:"trash",label:"ゴミ箱"});
      else if (action === "folder-open") dispatch({type:"NAVIGATE",view:"folder",id:id});
      else if (action === "folder-modal") { rememberDialogTrigger(target); dispatch({type:"OPEN_MODAL",modal:{type:"folder"}}); }
      else if (action === "folder-menu") { rememberDialogTrigger(target); dispatch({type:"OPEN_MODAL",modal:{type:"folder-menu",id:id}}); }
      else if (action === "folder-delete-request") dispatch({type:"OPEN_MODAL",modal:{type:"folder-delete",id:id}});
      else if (action === "folder-delete-confirm") dispatch({type:"DELETE_FOLDER",id:id});
      else if (action === "empty-trash") { rememberDialogTrigger(target); dispatch({type:"OPEN_MODAL",modal:{type:"empty-trash"}}); }
      else if (action === "empty-trash-confirm") { dispatch({type:"EMPTY_TRASH"}); dispatch({type:"CLOSE_MODAL"}); }
      else if (action === "back") dispatch({type:"RETURN_TO_MAILBOX"});
      else if (action === "move-archive") dispatch({type:"MOVE",ids:[id],folder:"archive",label:"アーカイブ"});
      else if (action === "trash-one") dispatch({type:"MOVE",ids:[id],folder:"trash",label:"ゴミ箱"});
      else if (action === "restore") dispatch({type:"RESTORE",id:id});
      else if (action === "delete-forever") dispatch({type:"DELETE_FOREVER",id:id});
      else if (action === "reply" || action === "reply-all") {
        const mail = state.messages.find(function(item){ return item.id === id; });
        if (mail) dispatch({type:"OPEN_COMPOSE",mode:"reply",to:mail.fromAddress,subject:"Re: " + mail.subject,body:"\n\n--- 元のメッセージ ---\n" + mail.body});
      }
      else if (action === "forward") {
        const mail = state.messages.find(function(item){ return item.id === id; });
        if (mail) dispatch({type:"OPEN_COMPOSE",mode:"forward",subject:"Fwd: " + mail.subject,body:"\n\n---------- 転送メッセージ ----------\nFrom: " + mail.from + "\nSubject: " + mail.subject + "\n\n" + mail.body,attachments:mail.attachment ? [{id:"forwarded-attachment",name:mail.attachment,size:0,type:"application/octet-stream"}] : []});
      }
      else if (action === "mark-unread") dispatch({type:"SET_READ",ids:[id],read:false});
      else if (action === "compose-close") dispatch({type:"RETURN_TO_MAILBOX"});
      else if (action === "save-draft") dispatch({type:"SAVE_DRAFT"});
      else if (action === "send-modal") { rememberDialogTrigger(target); dispatch({type:"REQUEST_SEND"}); }
      else if (action === "send-demo") dispatch({type:"SEND_DEMO"});
      else if (action === "modal-close") dispatch({type:"CLOSE_MODAL"});
      else if (action === "add-attachment") dispatch({type:"ADD_ATTACHMENT"});
      else if (action === "remove-attachment") dispatch({type:"REMOVE_ATTACHMENT"});
      else if (action === "attachment-demo") dispatch({type:"TOAST",message:"添付の表示を再現しています。ダウンロードは実行しません"});
      else if (action === "account") dispatch({type:"ACCOUNT"});
      else if (action === "demo-logout") dispatch({type:"TOAST",message:"ログアウト画面の動作確認です。セッション操作は行いません"});
      else if (action === "reset") dispatch({type:"RESET"});
      else if (action === "theme-cycle") dispatch({type:"THEME",value:state.theme === "dark" ? "light" : "dark"});
      else if (action === "theme") dispatch({type:"THEME",value:target.dataset.theme});
      else if (action === "profile") dispatch({type:"PROFILE",value:target.dataset.profile});
      else if (action === "profile-refresh") dispatch({type:"TOAST",message:"一覧を更新しました（架空データのため内容は変わりません）"});
      else if (action === "profile-move") dispatch({type:"TOAST",message:"移動先の選択を再現しています。メールは移動していません"});
      else if (action === "profile-tag") dispatch({type:"TOAST",message:"タグ操作を再現しています。メールは変更していません"});
      else if (action === "profile-more") dispatch({type:"TOAST",message:"その他の操作メニューを再現しています"});
      else if (action === "signature-save") dispatch({type:"TOAST",message:"署名を保存しました（デモ内のみ）"});
      else if (action === "forward-verify") dispatch({type:"VERIFY_FORWARD"});
      else if (action === "forward-enable") dispatch({type:"FORWARD_ENABLE"});
      else if (action === "forward-disable") dispatch({type:"FORWARD_DISABLE"});
      else if (action === "rule-toggle") dispatch({type:"TOGGLE_RULE",id:id});
      else if (action === "rule-delete") dispatch({type:"DELETE_RULE",id:id});
      else if (action === "address-default") dispatch({type:"DEFAULT_ADDRESS",id:id});
      else if (action === "address-remove") dispatch({type:"REMOVE_ADDRESS",id:id});
      else if (action === "key-revoke") dispatch({type:"REVOKE_KEY",id:id});
      else if (action === "ai-handoff") handoffAI(target.dataset.provider);
      else if (action === "domain-refresh") dispatch({type:"DOMAIN_REFRESH",id:id});
      else if (action === "domain-connect") dispatch({type:"DOMAIN_CONNECT",id:id});
      else if (action === "domain-disconnect") dispatch({type:"DOMAIN_DISCONNECT",id:id});
      else if (action === "user-edit") { rememberDialogTrigger(target); dispatch({type:"OPEN_MODAL",modal:{type:"user-edit",id:id}}); }
      else if (action === "import-demo") dispatch({type:"IMPORT_DEMO"});
    });

    root.addEventListener("input", function(event) {
      const target = event.target;
      if (target.dataset.input === "search") state = reducer(state,{type:"SEARCH",value:target.value});
      else if (target.dataset.input === "signature") state = reducer(state,{type:"SIGNATURE",value:target.value});
      else if (target.dataset.input === "ai-question") {
        state = reducer(state,{type:"AI_QUESTION",value:target.value});
        const preview = root.querySelector("[data-ai-preview]");
        if (preview) preview.textContent = "AIへ渡す質問文\n\n" + aiPrompt(state.ai.question, "");
      }
      else if (target.dataset.compose) state = reducer(state,{type:"COMPOSE_FIELD",field:target.dataset.compose,value:target.value});
    });

    root.addEventListener("change", function(event) {
      const target = event.target;
      if (target.dataset.change === "select") dispatch({type:"TOGGLE_SELECT",id:target.dataset.id});
      else if (target.dataset.change === "select-all") dispatch({type:"SELECT_ALL",ids:target.checked ? visibleMessages().map(function(item){ return item.id; }) : []});
      else if (target.dataset.change === "forward-ack") dispatch({type:"FORWARD_ACK",value:target.checked});
      else if (target.dataset.compose) state = reducer(state,{type:"COMPOSE_FIELD",field:target.dataset.compose,value:target.value});
    });

    root.addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.target;
      const data = new FormData(form);
      const type = form.dataset.form;
      if (type === "search") dispatch({type:"SEARCH_SUBMIT",value:String(data.get("query") || "")});
      else if (type === "compose") { rememberDialogTrigger(event.submitter); dispatch({type:"REQUEST_SEND"}); }
      else if (type === "folder") {
        const name = String(data.get("name") || "").trim();
        if (name) dispatch({type:"ADD_FOLDER",name:name});
      }
      else if (type === "folder-rename") {
        const name = String(data.get("name") || "").trim();
        if (name) dispatch({type:"RENAME_FOLDER",id:String(data.get("id")),name:name});
      }
      else if (type === "forwarding") {
        const destination = String(data.get("destination") || "").trim();
        if (isDemoAddress(destination)) dispatch({type:"FORWARD_DEST",value:destination});
        else dispatch({type:"TOAST",message:"転送先は .invalid で終わるデモ用メールアドレスを入力してください"});
      }
      else if (type === "rule") {
        const sender = String(data.get("sender") || "").trim();
        const subject = String(data.get("subject") || "").trim();
        if (sender || subject) dispatch({type:"ADD_RULE",sender:sender,subject:subject,folder:String(data.get("folder"))});
      }
      else if (type === "address") {
        const name = String(data.get("name") || "").trim();
        const address = String(data.get("address") || "").trim();
        if (isDemoAddress(address)) dispatch({type:"ADD_ADDRESS",name:name || "名称未設定",address:address});
        else dispatch({type:"TOAST",message:"アドレスは .invalid で終わるデモ用メールアドレスを入力してください"});
      }
      else if (type === "key") {
        const name = String(data.get("name") || "").trim();
        if (name) dispatch({type:"CREATE_KEY",name:name,scope:String(data.get("scope"))});
      }
      else if (type === "user") {
        const name = String(data.get("name") || "").trim();
        const address = String(data.get("address") || "").trim();
        if (name && isDemoAddress(address)) dispatch({type:"ADD_USER",name:name,address:address});
        else dispatch({type:"TOAST",message:"表示名と .invalid で終わるデモ用アドレスを入力してください"});
      }
      else if (type === "user-edit") {
        const id = String(data.get("id") || "");
        const name = String(data.get("name") || "").trim();
        const role = String(data.get("role") || "メンバー");
        if (id && name) dispatch({type:"EDIT_USER",id:id,name:name,role:role});
      }
    });

    window.addEventListener("keydown", function(event) {
      if (!state.modal) return;
      if (event.key === "Escape") {
        event.preventDefault();
        dispatch({type:"CLOSE_MODAL"});
        return;
      }
      if (event.key !== "Tab") return;
      const dialog = root.querySelector('[role="dialog"]');
      if (!dialog) return;
      const focusable = [...dialog.querySelectorAll('button:not([disabled]),input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')]
        .filter(function(element){ return !element.hidden; });
      if (!focusable.length) {
        event.preventDefault();
        dialog.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    });

    runSensitiveGuardCanary();
    render();
  </script>
</body>
</html>
