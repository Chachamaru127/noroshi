name: Release

# Cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The zip is for anyone who wants a pinned copy rather than a `git pull`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  live-demo-qa:
    name: Live demo visual and accessibility QA
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      QMJ12C_ARTIFACT_DIR: /tmp/qmj-12c-artifacts-release
      QMJ12C_BASELINE_MODE: exact
      QMJ12C_REFERENCE_CONTAINER: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compare live demo with reviewed baselines
        run: bun run test:live-demo:qa

      - name: Upload live demo QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-demo-qa-release-${{ github.run_id }}
          path: /tmp/qmj-12c-artifacts-release
          if-no-files-found: error

  release:
    name: Package and publish
    needs: live-demo-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Nothing ships until the template is provably free of personal config.
      - name: Check the template is clean
        run: bun run check:clean

      - name: Unit and integration tests
        run: bun test

      - name: D1 forwarding race test
        run: bun run test:d1-forwarding

      - name: Typecheck
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Extracted release archive smoke test
        run: bun run test:archive

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # git archive honours the export-ignore rules in .gitattributes. The clean
      # scanner remains in the archive so recipients can run the same guard.
      - name: Package
        run: |
          git archive --format=zip \
            --prefix="quickmail-ja-${{ steps.version.outputs.version }}/" \
            -o "quickmail-ja-${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.tag }}"
          unzip -l "quickmail-ja-${{ steps.version.outputs.version }}.zip" | tail -5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "quickmail-ja-${{ steps.version.outputs.version }}.zip" \
            --title "QuickMail-ja ${{ steps.version.outputs.tag }}" \
            --generate-notes
