name: Release

# Cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The zip is for anyone who wants a pinned copy rather than a `git pull`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from (e.g. v1.1.0)
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release ref before checkout
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  live-demo-qa:
    name: Live demo visual and accessibility QA
    needs: preflight
    runs-on: ubuntu-latest
    # Playwright v1.59.1-noble, linux/amd64 manifest digest.
    container:
      image: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    env:
      QMJ12C_ARTIFACT_DIR: /tmp/qmj-12c-artifacts-release
      QMJ12C_BASELINE_MODE: exact
      QMJ12C_REFERENCE_CONTAINER: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
      QMJ12C_REFERENCE_MARKER: playwright-1.59.1-noble-linux-amd64
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compare live demo with reviewed baselines
        run: bun run test:live-demo:qa

      - name: Upload live demo QA evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-demo-qa-release-${{ github.run_id }}
          path: /tmp/qmj-12c-artifacts-release
          if-no-files-found: error

  package:
    name: Verify and package
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Expose the validated version to the packaging steps
        id: version
        run: echo "version=${{ needs.preflight.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Require committed human approvals
        run: node prototype/quickmail-ja-live-demo/release-gates.mjs

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the template is clean
        run: bun run check:clean

      - name: Unit and integration tests
        run: bun test

      - name: D1 forwarding race test
        run: bun run test:d1-forwarding

      - name: Typecheck
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Extracted release archive smoke test
        run: bun run test:archive

      - name: Package
        run: |
          git archive --format=zip \
            --prefix="quickmail-ja-${{ steps.version.outputs.version }}/" \
            -o "quickmail-ja-${{ steps.version.outputs.version }}.zip" \
            "${{ needs.preflight.outputs.tag }}"
          unzip -l "quickmail-ja-${{ steps.version.outputs.version }}.zip" | tail -5

      - name: Upload verified release package
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickmail-ja-release-${{ github.run_id }}
          path: quickmail-ja-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    name: Publish verified package
    needs: [preflight, live-demo-qa, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quickmail-ja-release-${{ github.run_id }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" \
            "quickmail-ja-${{ needs.preflight.outputs.version }}.zip" \
            --title "QuickMail-ja ${{ needs.preflight.outputs.tag }}" \
            --generate-notes
