name: Release

# Cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The zip is for anyone who wants a pinned copy rather than a `git pull`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from (e.g. v1.1.0)
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release ref before checkout
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - name: Resolve and validate existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          OBJECT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJECT_TYPE="$(jq -er '.object.type' <<<"$OBJECT_JSON")"
          OBJECT_SHA="$(jq -er '.object.sha' <<<"$OBJECT_JSON")"
          for _ in 1 2 3 4 5 6 7 8; do
            [[ "$OBJECT_TYPE" == tag ]] || break
            OBJECT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}")"
            OBJECT_TYPE="$(jq -er '.object.type' <<<"$OBJECT_JSON")"
            OBJECT_SHA="$(jq -er '.object.sha' <<<"$OBJECT_JSON")"
          done
          if [[ "$OBJECT_TYPE" != commit || ! "$OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Tag does not peel to a full commit SHA: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$OBJECT_SHA" >> "$GITHUB_OUTPUT"

  live-demo-qa:
    name: Live demo visual and accessibility QA
    needs: preflight
    runs-on: ubuntu-latest
    # Playwright v1.59.1-noble, linux/amd64 manifest digest.
    container:
      image: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    env:
      QMJ12C_ARTIFACT_DIR: /tmp/qmj-12c-artifacts-release
      QMJ12C_BASELINE_MODE: exact
      QMJ12C_REFERENCE_CONTAINER: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
      QMJ12C_REFERENCE_MARKER: playwright-1.59.1-noble-linux-amd64
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compare live demo with reviewed baselines
        run: bun run test:live-demo:qa

      - name: Upload live demo QA evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-demo-qa-release-${{ github.run_id }}
          path: /tmp/qmj-12c-artifacts-release
          if-no-files-found: error

  package:
    name: Verify and package
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Expose the validated version to the packaging steps
        id: version
        run: echo "version=${{ needs.preflight.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Require committed human approvals
        run: node prototype/quickmail-ja-live-demo/release-gates.mjs

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the template is clean
        run: bun run check:clean

      - name: Live demo contract tests
        run: bun run test:live-demo:contracts

      - name: Unit and integration tests
        run: bun test

      - name: D1 forwarding race test
        run: bun run test:d1-forwarding

      - name: Typecheck
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Extracted release archive smoke test
        run: bun run test:archive

      - name: Package
        run: |
          git archive --format=zip \
            --prefix="noroshi-mail-${{ steps.version.outputs.version }}/" \
            -o "noroshi-mail-${{ steps.version.outputs.version }}.zip" \
            "${{ needs.preflight.outputs.commit_sha }}"
          unzip -l "noroshi-mail-${{ steps.version.outputs.version }}.zip" | tail -5
          bun scripts/release-supply-chain.mjs generate \
            "noroshi-mail-${{ steps.version.outputs.version }}.zip" \
            "${{ needs.preflight.outputs.tag }}" \
            "${{ needs.preflight.outputs.commit_sha }}"
          bun scripts/release-supply-chain.mjs verify \
            "noroshi-mail-${{ steps.version.outputs.version }}.zip" \
            "${{ needs.preflight.outputs.tag }}" \
            "${{ needs.preflight.outputs.commit_sha }}"
          sha256sum --check SHA256SUMS

      - name: Upload verified release package
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noroshi-mail-release-${{ github.run_id }}
          path: |
            noroshi-mail-${{ steps.version.outputs.version }}.zip
            SHA256SUMS
            noroshi-mail.spdx.json
            release-provenance.json
            release-evidence.json
          if-no-files-found: error

  publish:
    name: Publish verified package
    needs: [preflight, live-demo-qa, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noroshi-mail-release-${{ github.run_id }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ARCHIVE="noroshi-mail-${VERSION}.zip"
          jq -e \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg commitSha "$EXPECTED_SHA" \
            'type == "object" and
             keys == ["archiveSha256", "commitSha", "tag", "version"] and
             (.tag | type == "string") and .tag == $tag and
             (.version | type == "string") and .version == $version and
             (.commitSha | type == "string") and .commitSha == $commitSha and
             (.commitSha | test("^[0-9a-f]{40}$")) and
             (.archiveSha256 | type == "string") and
             (.archiveSha256 | test("^[0-9a-f]{64}$"))' \
            release-evidence.json >/dev/null
          EVIDENCE_ARCHIVE_SHA="$(jq -r '.archiveSha256' release-evidence.json)"
          ACTUAL_ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          if [[ "$ACTUAL_ARCHIVE_SHA" != "$EVIDENCE_ARCHIVE_SHA" ]]; then
            echo "Downloaded archive does not match release evidence" >&2
            exit 1
          fi

          OBJECT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJECT_TYPE="$(jq -er '.object.type' <<<"$OBJECT_JSON")"
          OBJECT_SHA="$(jq -er '.object.sha' <<<"$OBJECT_JSON")"
          for _ in 1 2 3 4 5 6 7 8; do
            [[ "$OBJECT_TYPE" == tag ]] || break
            OBJECT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}")"
            OBJECT_TYPE="$(jq -er '.object.type' <<<"$OBJECT_JSON")"
            OBJECT_SHA="$(jq -er '.object.sha' <<<"$OBJECT_JSON")"
          done
          if [[ "$OBJECT_TYPE" != commit || "$OBJECT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Release tag moved or no longer peels to the validated commit" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$ARCHIVE" \
            SHA256SUMS \
            noroshi-mail.spdx.json \
            release-provenance.json \
            release-evidence.json \
            --title "Noroshi $TAG" \
            --generate-notes
