name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-demo-qa:
    name: Live demo visual and accessibility QA
    runs-on: ubuntu-latest
    # Playwright v1.59.1-noble, linux/amd64 manifest digest.
    container:
      image: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    env:
      QMJ12C_ARTIFACT_DIR: /tmp/qmj-12c-artifacts-ci
      QMJ12C_BASELINE_MODE: exact
      QMJ12C_REFERENCE_CONTAINER: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
      QMJ12C_REFERENCE_MARKER: playwright-1.59.1-noble-linux-amd64
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compare live demo with reviewed baselines
        run: bun run test:live-demo:qa

      - name: Upload live demo QA evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-demo-qa-${{ github.run_id }}
          path: /tmp/qmj-12c-artifacts-ci
          if-no-files-found: error

  verify:
    name: Verify the template
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Runs first: if a secret leaked, fail before anything else touches it.
      - name: Check the template is clean
        run: bun run check:clean

      - name: Live demo contract tests
        run: bun run test:live-demo:contracts

      - name: Unit and integration tests
        run: bun test

      - name: D1 forwarding race test
        run: bun run test:d1-forwarding

      - name: Typecheck
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Extracted release archive smoke test
        run: bun run test:archive
